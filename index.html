<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الريسك الكروية - فريقين</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.3rem;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: #aaa;
      font-size: 1.05rem;
    }

    /* شاشة البداية */
    .start-screen {
      max-width: 480px;
      margin: 60px auto;
      background: rgba(255,255,255,0.06);
      padding: 35px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }

    .start-screen h2 {
      margin-bottom: 25px;
      color: #00f2fe;
    }

    .start-screen input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    .start-screen input:focus {
      box-shadow: 0 0 0 2px #00f2fe;
    }

    /* لوحة النتائج */
    .score-board {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .score-box {
      background: rgba(255,255,255,0.08);
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      min-width: 180px;
      text-align: center;
      transition: 0.3s;
    }

    .score-box.active-turn {
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
      background: rgba(0, 242, 254, 0.1);
    }

    .score-box .team-name {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .score-box .points {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00f2fe;
    }

    .turn-indicator {
      text-align: center;
      margin-bottom: 18px;
      font-size: 1.2rem;
      color: #ffd700;
    }

    /* اللوحة */
    .board {
      display: grid;
      grid-template-columns: 150px repeat(5, 1fr);
      gap: 7px;
      margin-bottom: 25px;
    }

    .cell {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 16px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .cell:hover:not(.used):not(.header):not(.points) {
      background: rgba(0, 242, 254, 0.15);
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0, 242, 254, 0.2);
    }

    .cell.header {
      background: rgba(0, 242, 254, 0.15);
      cursor: default;
      font-size: 0.88rem;
      color: #00f2fe;
    }

    .cell.points {
      background: rgba(255,255,255,0.05);
      cursor: default;
      color: #ffd700;
      font-size: 1.05rem;
    }

    .cell.used {
      background: rgba(0,0,0,0.45);
      color: #555;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.87);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 30px;
      max-width: 540px;
      width: 100%;
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
      text-align: center;
    }

    .modal-content h2 {
      color: #00f2fe;
      margin-bottom: 12px;
      font-size: 1.25rem;
    }

    .question-text {
      font-size: 1.22rem;
      line-height: 1.65;
      margin-bottom: 22px;
      color: #eee;
    }

    .timer {
      font-size: 2.3rem;
      font-weight: bold;
      color: #ff6b6b;
      margin-bottom: 18px;
    }

    .answer-input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.15rem;
      text-align: center;
      margin-bottom: 18px;
      outline: none;
    }

    .answer-input:focus {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 0 2px #00f2fe;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      color: #000;
    }

    .btn-primary:hover {
      transform: scale(1.05);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .result-msg {
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 28px;
    }

    .correct { color: #00ff9d; }
    .wrong { color: #ff6b6b; }

    .controls {
      text-align: center;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>

    // ================== حالة اللعبة ==================
    let team1 = { name: "الفريق الأحمر", score: 0 };
    let team2 = { name: "الفريق الأزرق", score: 0 };
    let currentTeam = 1; // 1 أو 2
    let remaining = 20;
    let currentQuestion = null;
    let currentPoints = 0;
    let currentCell = null;
    let timerInterval = null;
    let timeLeft = 25;

    // ================== دوال مساعدة ==================
    function normalize(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/\s+/g, ' ');
    }

    function startGame() {
      const name1 = document.getElementById('team1Name').value.trim() || "الفريق الأحمر";
      const name2 = document.getElementById('team2Name').value.trim() || "الفريق الأزرق";

      team1.name = name1;
      team2.name = name2;

      document.getElementById('displayTeam1').textContent = team1.name;
      document.getElementById('displayTeam2').textContent = team2.name;
      document.getElementById('currentTurnName').textContent = team1.name;

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      updateTurnUI();
      buildBoard();
    }

    function updateTurnUI() {
      document.getElementById('team1Box').classList.toggle('active-turn', currentTeam === 1);
      document.getElementById('team2Box').classList.toggle('active-turn', currentTeam === 2);
      document.getElementById('currentTurnName').textContent = currentTeam === 1 ? team1.name : team2.name;
    }

    function buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      // الصف الأول
      const empty = document.createElement('div');
      empty.className = 'cell points';
      board.appendChild(empty);

      categories.forEach(cat => {
        const cell = document.createElement('div');
        cell.className = 'cell header';
        cell.textContent = cat;
        board.appendChild(cell);
      });

      // باقي الصفوف
      pointsLevels.forEach(p => {
        const pointsCell = document.createElement('div');
        pointsCell.className = 'cell points';
        pointsCell.textContent = p + ' نقطة';
        board.appendChild(pointsCell);

        categories.forEach(cat => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = p;
          cell.dataset.category = cat;
          cell.dataset.points = p;

          cell.addEventListener('click', () => openQuestion(cat, p, cell));
          board.appendChild(cell);
        });
      });
    }

    function openQuestion(category, pointsValue, cell) {
      if (cell.classList.contains('used')) return;

      const pool = questionsBank[category][pointsValue];
      currentQuestion = pool[Math.floor(Math.random() * pool.length)];
      currentPoints = pointsValue;
      currentCell = cell;

      document.getElementById('modalCategory').textContent = `${category} - ${pointsValue} نقطة`;
      document.getElementById('questionText').textContent = currentQuestion.q;
      document.getElementById('answerInput').value = '';
      document.getElementById('resultMsg').textContent = '';
      document.getElementById('answerInput').style.display = 'block';
      document.getElementById('submitBtn').style.display = 'inline-block';

      timeLeft = 25;
      document.getElementById('timer').textContent = timeLeft;
      document.getElementById('questionModal').classList.add('active');
      document.getElementById('answerInput').focus();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endQuestion(false, true);
        }
      }, 1000);
    }

    function checkAnswer() {
      const userAnswer = document.getElementById('answerInput').value.trim();
      if (!userAnswer) return;

      clearInterval(timerInterval);

      const normalizedUser = normalize(userAnswer);
      let isCorrect = false;

      for (let ans of currentQuestion.a) {
        const normalizedAns = normalize(ans);
        if (normalizedUser.includes(normalizedAns) || normalizedAns.includes(normalizedUser)) {
          isCorrect = true;
          break;
        }
      }

      endQuestion(isCorrect);
    }

    function endQuestion(isCorrect, timeout = false) {
      const resultMsg = document.getElementById('resultMsg');
      document.getElementById('answerInput').style.display = 'none';
      document.getElementById('submitBtn').style.display = 'none';

      if (isCorrect) {
        if (currentTeam === 1) {
          team1.score += currentPoints;
          document.getElementById('score1').textContent = team1.score;
        } else {
          team2.score += currentPoints;
          document.getElementById('score2').textContent = team2.score;
        }
        resultMsg.innerHTML = `<span class="correct">إجابة صحيحة! +${currentPoints} نقطة</span>`;
      } else {
        resultMsg.innerHTML = `<span class="wrong">${timeout ? 'انتهى الوقت!' : 'إجابة خاطئة!'}<br>الإجابة: ${currentQuestion.a[0]}</span>`;
      }

      remaining--;
      currentCell.classList.add('used');
      currentCell.style.pointerEvents = 'none';

      // تبديل الدور
      currentTeam = currentTeam === 1 ? 2 : 1;
      updateTurnUI();

      setTimeout(() => {
        document.getElementById('questionModal').classList.remove('active');

        if (remaining === 0) {
          setTimeout(() => {
            let winnerMsg = '';
            if (team1.score > team2.score) {
              winnerMsg = `فاز ${team1.name} بنتيجة ${team1.score} - ${team2.score}`;
            } else if (team2.score > team1.score) {
              winnerMsg = `فاز ${team2.name} بنتيجة ${team2.score} - ${team1.score}`;
            } else {
              winnerMsg = `تعادل! ${team1.score} - ${team2.score}`;
            }
            alert('انتهت اللعبة!\n' + winnerMsg);
          }, 400);
        }
      }, 2600);
    }

    // دعم Enter
    document.getElementById('answerInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkAnswer();
    });
  </script>
